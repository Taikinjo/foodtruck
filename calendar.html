<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Food Truck — Calendar</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="./index.html">
        <img src="./assets/logo.png" alt="Logo" onerror="this.style.display='none'">
        <span>Food Truck</span>
      </a>
      <nav class="nav-links">
        <a href="./index.html">About</a>
        <a href="./calendar.html">Calendar</a>
        <a href="./menu.html">Menu</a>
        <a href="./cart.html">
          Cart <span class="badge" data-cart-badge style="display:none">0</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card section">
      <h2>Upcoming locations</h2>
      <p class="muted">
        Update <code>data/schedule.json</code> to change this list.
        (Later, you can swap this for a Google Calendar embed if you want.)
      </p>
      <div id="scheduleStatus" class="note"></div>
    </section>

    <div id="scheduleRoot" class="grid" style="grid-template-columns: 1fr; margin-top: 14px;"></div>

    <footer class="footer">
      <div>Tip: keep times in 24-hour format to avoid confusion.</div>
    </footer>
  </main>

  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/calendar.js"></script>
</body>
</html>
