<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Food Truck — Menu</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="./index.html">
        <img src="./assets/logo.png" alt="Logo" onerror="this.style.display='none'">
        <span>Food Truck</span>
      </a>
      <nav class="nav-links">
        <a href="./index.html">About</a>
        <a href="./calendar.html">Calendar</a>
        <a href="./menu.html">Menu</a>
        <a href="./cart.html">
          Cart <span class="badge" data-cart-badge style="display:none">0</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card section">
      <h2>Menu</h2>
      <p class="muted">Tap items to add them to your cart.</p>
      <div id="menuStatus" class="note"></div>
    </section>

    <!-- Menu renders here -->
    <div id="menuRoot" class="grid" style="grid-template-columns: 1fr; gap:14px; margin-top:14px;"></div>

    <footer class="footer">
      <a class="btn primary" href="./cart.html">Go to Cart</a>
    </footer>
  </main>

  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/menu.js"></script>
</body>
</html>
